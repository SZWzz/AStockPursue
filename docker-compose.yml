services:
  astockpursue:
    build: .
    ports:
      - "8899:8899"
      - "8900:8900"      # MCP Server (SSE transport)
    env_file:
      - agent/.env
    environment:
      ASTOCKPURSUE_TRUST_DOCKER_LOOPBACK: 1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - astockpursue-runs:/app/agent/runs
      - astockpursue-sessions:/app/agent/sessions
      - astockpursue-skills:/root/.AStockPursue/skills
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8899/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - vt-net

  frontend:
    image: node:20
    working_dir: /app
    ports:
      - "5899:5899"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_URL=http://astockpursue:8899
    command: sh -c "npm install && chmod +x node_modules/.bin/* 2>/dev/null; node ./node_modules/vite/bin/vite.js --host --port 5899"
    profiles:
      - frontend
    depends_on:
      astockpursue:
        condition: service_started
    networks:
      - vt-net

volumes:
  astockpursue-runs:
  astockpursue-sessions:
  astockpursue-skills:

networks:
  vt-net:
    driver: bridge
