services:
  astockpursue:
    build: .
    ports:
      - "8899:8899"
      - "8900:8900"      # MCP Server (SSE transport)
    env_file:
      - backend/.env
    environment:
      ASTOCKPURSUE_TRUST_DOCKER_LOOPBACK: 1
      ASTOCKPURSUE_ALLOWED_RUN_ROOTS: "/opt/data,/root/.AStockPursue/workspace"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - astockpursue-runs:/ap./backend/runs
      - astockpursue-sessions:/ap./backend/sessions
      - astockpursue-skills:/root/.AStockPursue/skills
      - /opt/data:/opt/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8899/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - vt-net

  frontend:
    image: node:20
    working_dir: /app
    ports:
      - "5899:5899"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_URL=http://astockpursue:8899
    command: sh -c "npm install && chmod +x node_modules/.bin/* 2>/dev/null; node ./node_modules/vite/bin/vite.js --host --port 5899"
    profiles:
      - frontend
    depends_on:
      astockpursue:
        condition: service_started
    networks:
      - vt-net

  # Auto-deployed PostgreSQL for users without an existing PG instance.
  # If you already have a PostgreSQL instance, configure DB_HOST/DB_PORT/
  # DB_NAME/DB_USER/DB_PASSWORD_ENC in backend/.env and skip the pg profile.
  # WARNING: The default password below is for development only.
  # Change it before exposing this service to a network.
  # Set POSTGRES_PASSWORD in a .env file to override:
  #   echo "POSTGRES_PASSWORD=your_secure_password" >> .env
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: AStockPursue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vr_pg_2026}
      POSTGRES_DB: AStockPursue
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - vt-net
    profiles:
      - pg

volumes:
  astockpursue-runs:
  astockpursue-sessions:
  astockpursue-skills:
  pg-data:

networks:
  vt-net:
    driver: bridge
