services:
  go-core:
    build:
      context: services/go
      dockerfile: Dockerfile
    ports:
      - "8899:8899"
      - "8901:8901"
    environment:
      PORT: "8899"
      GRPC_PORT: "8901"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/astockpursue?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - vt-net

  python-research:
    build:
      context: services/python
      dockerfile: Dockerfile.python
    ports:
      - "8900:8900"
      - "8902:8902"
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/astockpursue?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      go-core:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - vt-net
    volumes:
      - ./runs:/app/runs
      - ./services/python/src:/app/src

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "5899:5899"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8899"
    depends_on:
      - go-core
    networks:
      - vt-net
    profiles:
      - frontend

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: astockpursue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./services/python/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vt-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - vt-net

networks:
  vt-net:
    driver: bridge

volumes:
  pg-data:
  redis-data:
