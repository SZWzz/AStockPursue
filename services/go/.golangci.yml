run:
  go: "1.22"
  tests: false

output:
  formats: "colored-line-number"

issues:
  exclude-rules:
    - path: internal/gen/
      linters:
        - all
    # Pre-existing code patterns — not introduced by refactoring
    - text: "S1009:"
      linters:
        - gosimple
    - text: "SA9003:"
      linters:
        - staticcheck
