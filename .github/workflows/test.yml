name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Gate: fast syntax check (blocks nothing but catches broken imports early) ──
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Syntax check
        run: |
          cd backend
          python -m py_compile cli.py
          python -m py_compile api_server.py
          python -m py_compile mcp_server.py
          python -m py_compile src/agent/loop.py
          python -m py_compile src/tools/__init__.py
          python -m py_compile backtest/runner.py

  # ── Security: dependency vulnerability scanning ──
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python deps
        run: pip install -e ".[dev]"
      - name: Run pip-audit
        run: pip-audit --strict --progress-spinner=on --desc=on
      - name: Run npm audit (frontend)
        working-directory: frontend
        run: npm ci --ignore-scripts && npm audit --audit-level=high

  # ── Fast tests: everything EXCEPT subprocess-spawning MCP integration tests ──
  test-fast:
    needs: [syntax, security]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install -e ".[dev]"
          pip install pytest-xdist pytest-timeout
      - name: Run fast tests
        run: |
          cd backend
          pytest -m "not slow" -q --tb=short -n auto --dist loadgroup --timeout=60

  # ── Slow tests: MCP subprocess integration tests ──
  test-slow:
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install -e ".[dev]"
          pip install pytest-xdist pytest-timeout
      - name: Run slow tests
        run: |
          cd backend
          pytest -m slow -q --tb=short -n 2 --dist loadgroup --timeout=60

  # ── Frontend build (independent, runs in parallel with tests) ──
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build
        run: |
          cd frontend
          npm ci
          npm run build
