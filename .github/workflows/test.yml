name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Gate: fast syntax check (blocks nothing but catches broken imports early) ──
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Syntax check
        run: |
          cd services/python
          python -m py_compile cli.py
          python -m py_compile mcp_server.py
          python -m py_compile src/agent/loop.py

  # ── Security: dependency vulnerability scanning ──
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python deps
        run: pip install -e ".[dev]"
      - name: Run pip-audit
        # Known vulnerabilities in langgraph ecosystem — all require major version upgrades (breaking changes).
        # All are post-exploitation / defense-in-depth: attacker needs prior write access to checkpoint store or cache.
        # TODO: upgrade when langgraph 1.x is stable and compatible with our codebase.
        run: |
          pip-audit --strict --progress-spinner=on --desc=on -r services/python/requirements.txt \
            --ignore-vuln PYSEC-2026-83 \
            --ignore-vuln CVE-2025-64439 \
            --ignore-vuln CVE-2026-27794 \
            --ignore-vuln PYSEC-2026-77 \
            --ignore-vuln PYSEC-2026-76 \
            --ignore-vuln GHSA-gr75-jv2w-4656
      - name: Run npm audit (frontend)
        working-directory: frontend
        run: npm install --legacy-peer-deps --ignore-scripts && npm audit --audit-level=high || true

  # ── Fast tests: everything EXCEPT subprocess-spawning MCP integration tests ──
  test-fast:
    needs: [syntax, security]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install -e ".[dev]"
          pip install pytest-xdist pytest-timeout
      - name: Run fast tests
        run: |
          cd services/python
          pytest -m "not slow" -q --tb=short -n auto --dist loadgroup --timeout=60

  # ── Slow tests: MCP subprocess integration tests ──
  test-slow:
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install -e ".[dev]"
          pip install pytest-xdist pytest-timeout
      - name: Run slow tests
        run: |
          cd services/python
          pytest -m slow -q --tb=short -n 2 --dist loadgroup --timeout=60

  # ── Frontend build (independent, runs in parallel with tests) ──
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

  # ── Proto contract: lint proto files with buf ──
  proto-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - uses: bufbuild/buf-lint-action@v1
        with:
          input: services/proto

  # ── E2E: start services and run end-to-end tests ──
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Start services
        run: |
          docker compose up -d
          sleep 10
      - name: Run E2E tests
        run: |
          cd tests/e2e
          go test ./... -v -count=1 -timeout 60s
      - name: Stop services
        if: always()
        run: docker compose down
